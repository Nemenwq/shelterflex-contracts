[package]
name = "deal_escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban_pausable_core = { path = "../soroban_pausable_core" }
soroban-sdk = "22.0.7"
soroban_access_control_core = { path = "../soroban_access_control_core" }
soroban_reentrancy_guard = { version = "0.1.0", path = "../soroban_reentrancy_guard" }

[dev-dependencies]
soroban-sdk = { version = "22.0.7", features = ["testutils"] }
rent_payments = { version = "0.1.0", path = "../rent_payments", features = ["testutils"] }
rent_wallet = { version = "0.1.0", path = "../rent_wallet", features = ["testutils"] }

