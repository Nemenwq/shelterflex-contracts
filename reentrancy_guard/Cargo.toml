[package]
name = "reentrancy_guard"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.7"
soroban_access_control = { version = "0.1.0", path = "../soroban_access_control" }
soroban_storage_ttl = { path = "../soroban_storage_ttl" }

[dev-dependencies]
soroban-sdk = { version = "22.0.7", features = ["testutils"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
