[package]
name = "transaction-receipt-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban_pausable_core = { path = "../soroban_pausable_core" }
soroban-sdk = "22.0.7"

[dev-dependencies]
soroban-sdk = { version = "22.0.7", features = ["testutils"] }
proptest = "1.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
