[package]
name = "vesting_schedule"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.7"
soroban_pausable_core = { path = "../soroban_pausable_core" }
soroban_reentrancy_guard = { version = "0.1.0", path = "../soroban_reentrancy_guard" }
soroban_storage_ttl = { path = "../soroban_storage_ttl" }

[dev-dependencies]
soroban-sdk = { version = "22.0.7", features = ["testutils"] }
